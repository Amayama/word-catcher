<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="version" content="v0.8-ar">
<title>Word Catcher · 听句抓词 v0.2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0C0E13;overflow:hidden;
  font-family:'Roboto','PingFang SC','WenQuanYi Zen Hei','Microsoft YaHei',sans-serif;color:#F4EFE6}
#app{position:relative;width:100vw;height:100vh;background:#12141A;overflow:hidden}

/* ===== night forest scene ===== */
#scene{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
#tint{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(26,34,56,.55),rgba(18,20,26,.25) 40%,rgba(18,20,26,.45)),
  radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(10,12,18,.55) 100%)}
.moon{position:absolute;right:7%;top:7%;width:clamp(90px,17%,180px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 38%,#FBF7EE,#E9E2D2 62%,rgba(233,226,210,0) 74%);
  box-shadow:0 0 70px 24px rgba(244,239,230,.22)}
#stars{position:absolute;inset:0;background-image:
  radial-gradient(2px 2px at 12% 8%,rgba(244,239,230,.8) 45%,transparent 50%),
  radial-gradient(1.6px 1.6px at 31% 15%,rgba(244,239,230,.6) 45%,transparent 50%),
  radial-gradient(2px 2px at 52% 6%,rgba(244,239,230,.7) 45%,transparent 50%),
  radial-gradient(1.4px 1.4px at 68% 18%,rgba(244,239,230,.5) 45%,transparent 50%),
  radial-gradient(1.8px 1.8px at 84% 10%,rgba(244,239,230,.65) 45%,transparent 50%),
  radial-gradient(1.5px 1.5px at 22% 26%,rgba(244,239,230,.4) 45%,transparent 50%),
  radial-gradient(1.5px 1.5px at 91% 30%,rgba(244,239,230,.45) 45%,transparent 50%),
  radial-gradient(1.3px 1.3px at 45% 24%,rgba(244,239,230,.35) 45%,transparent 50%)}
.amb{position:absolute;inset:0;opacity:.92}
.foliage{position:absolute;pointer-events:none}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='0.5'/></svg>");
  background-size:240px 240px}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3}
#diag{position:absolute;left:20px;bottom:16px;z-index:4;font-size:10px;letter-spacing:1px;color:#8b96a8;opacity:.65}
.petal{position:absolute;border-radius:60% 40% 60% 40%;background:#D3A1AC;opacity:.4;z-index:2;pointer-events:none;
  animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-8%) rotate(0)}to{transform:translate(var(--dx),118%) rotate(300deg)}}

#speaker{position:absolute;right:2.5%;top:3%;width:52px;height:52px;border-radius:50%;
  background:rgba(18,20,26,.55);border:1.5px solid rgba(244,239,230,.28);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8;transition:transform .15s}
#speaker:active{transform:scale(.92)}
#speaker svg{width:28px;height:28px}
#speaker .dot{position:absolute;right:5px;top:5px;width:9px;height:9px;border-radius:50%;background:#D3A1AC;box-shadow:0 0 8px rgba(211,161,172,.9)}
#speaker.muted .dot{background:#5a6170;box-shadow:none}
#speaker.muted .wave{opacity:.15}
#sprayGlow{position:absolute;right:2%;top:2%;width:90px;height:90px;border-radius:50%;z-index:2;
  background:radial-gradient(closest-side,rgba(211,161,172,.55),rgba(211,161,172,0) 70%);
  filter:blur(6px);opacity:0;transition:opacity .25s;pointer-events:none}
#sprayGlow.on{opacity:1}

#strip{position:absolute;left:20px;top:20px;z-index:6;
  background:rgba(16,19,28,.82);border:1.5px solid rgba(244,239,230,.16);
  border-radius:22px;padding:10px 18px;backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:12px;max-width:calc(100vw - 140px);flex-wrap:wrap}
#cam{position:absolute;inset:0;border-radius:0;background:#0C0E13;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
  filter:brightness(.85) saturate(.85)}
#camShade{position:absolute;inset:0;background:
  radial-gradient(70% 55% at 50% 0%,rgba(46,59,82,.35),transparent 70%),
  linear-gradient(180deg,rgba(12,14,19,.2),rgba(10,12,17,.5));pointer-events:none}
#scan{position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px)}
#camLabel{position:absolute;left:20px;bottom:16px;font-size:10px;letter-spacing:2px;color:#F4EFE6;opacity:.45;z-index:5}
#camLive{position:absolute;right:20px;top:84px;font-size:11px;letter-spacing:2px;color:#D3A1AC;opacity:.85;z-index:5;
  display:flex;align-items:center;gap:7px}
#camLive i{width:8px;height:8px;border-radius:50%;background:#D3A1AC;box-shadow:0 0 8px rgba(211,161,172,.9);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#hud{position:absolute;inset:0;width:100%;height:100%;z-index:4}

#overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;text-align:center;
  background:rgba(10,12,18,.85);backdrop-filter:blur(6px);padding:0 12%}
#overlay .title{font-family:'Tinos',Georgia,serif;font-weight:700;font-size:34px;letter-spacing:1px;line-height:1.25}
#overlay .title b{color:#D3A1AC;font-style:italic}
#overlay p{font-size:14px;color:#c8cdd8;line-height:1.8}
#overlay .steps{font-size:13px;color:#8b96a8;line-height:2}
#startBtn{margin-top:6px;padding:14px 52px;border-radius:44px;border:none;cursor:pointer;
  font-size:18px;font-weight:800;color:#10131C;letter-spacing:2px;
  background:linear-gradient(90deg,#B4838F,#D3A1AC);box-shadow:0 0 30px rgba(211,161,172,.4)}
#startBtn:active{transform:scale(.96)}
#overlay.hidden{display:none}
#toast{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:15;
  padding:10px 26px;border-radius:30px;font-size:14px;letter-spacing:1px;
  background:rgba(16,19,28,.92);border:1px solid rgba(211,161,172,.4);color:#F4EFE6;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#toast.good{color:#F4EFE6;border-color:rgba(211,161,172,.8)}
#toast.bad{color:#f3c6ce;border-color:rgba(217,100,122,.6)}

#coach{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:14;
  background:rgba(14,17,26,.78);border:1.5px solid rgba(211,161,172,.4);border-radius:26px;
  padding:30px 54px;text-align:center;backdrop-filter:blur(8px);
  box-shadow:0 18px 60px rgba(0,0,0,.5)}
#coach .cnum{display:inline-block;font-size:26px;font-weight:800;color:#10131C;
  background:#D3A1AC;border-radius:12px;padding:2px 16px;margin-bottom:16px}
#coach .clabel{font-size:34px;font-weight:700;margin-bottom:22px}
#coach .cbar{width:340px;height:14px;border-radius:7px;background:rgba(244,239,230,.15);overflow:hidden;margin:0 auto}
#coach .cfill{height:100%;width:0%;border-radius:7px;background:linear-gradient(90deg,#B4838F,#D3A1AC);
  box-shadow:0 0 14px rgba(211,161,172,.8);transition:width .12s}
#coach .cpct{margin-top:14px;font-size:30px;font-weight:800;color:#D3A1AC}
#coach.error{border-color:rgba(217,100,122,.6)}
#coach.hidden{display:none}
#flash{position:absolute;inset:0;z-index:12;pointer-events:none;opacity:0;
  background:radial-gradient(100% 100% at 50% 50%,rgba(244,239,230,.28),rgba(211,161,172,.12) 60%,transparent)}
#flash.go{animation:flashgo .5s ease-out}
@keyframes flashgo{0%{opacity:1}100%{opacity:0}}
#modeTag{position:absolute;left:20px;bottom:34px;z-index:9;font-size:10px;letter-spacing:2px;color:#F4EFE6;opacity:.55}
</style>
</head>
<body>
<div id="app">
  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div id="camShade"></div><div id="scan"></div>
    <canvas id="hud"></canvas>
    <div id="camLive"><i></i>LIVE · 手部追踪中</div>
    <div id="camLabel">镜头 · 对准你</div>
  <div id="scene">
    <div class="amb"><div class="moon"></div><div id="stars"></div>
    <svg class="foliage" style="left:-6%;top:12%;width:34%;opacity:.9" viewBox="0 0 300 300">
      <g fill="#2C4236"><circle cx="40" cy="220" r="78"/><circle cx="130" cy="250" r="64"/><circle cx="220" cy="230" r="70"/><circle cx="95" cy="170" r="55"/><circle cx="185" cy="160" r="50"/></g>
      <g fill="#3E5A48"><circle cx="60" cy="200" r="48"/><circle cx="150" cy="225" r="40"/><circle cx="210" cy="205" r="44"/></g>
      <g fill="#4F6F57"><circle cx="80" cy="185" r="26"/><circle cx="165" cy="200" r="22"/><circle cx="195" cy="180" r="20"/></g>
      <g fill="#D3A1AC" fill-opacity=".85"><circle cx="75" cy="170" r="6"/><circle cx="95" cy="200" r="5"/><circle cx="160" cy="185" r="5"/><circle cx="180" cy="215" r="4.5"/><circle cx="205" cy="165" r="5"/></g>
      <g fill="#F4EFE6" fill-opacity=".9"><circle cx="76" cy="170" r="1.8"/><circle cx="96" cy="200" r="1.5"/><circle cx="161" cy="185" r="1.5"/><circle cx="206" cy="165" r="1.5"/></g>
    </svg>
    <svg class="foliage" style="right:-6%;top:36%;width:32%;opacity:.85" viewBox="0 0 300 300">
      <g fill="#2C4236"><circle cx="260" cy="200" r="76"/><circle cx="170" cy="240" r="60"/><circle cx="100" cy="215" r="64"/><circle cx="205" cy="150" r="52"/></g>
      <g fill="#3E5A48"><circle cx="240" cy="185" r="46"/><circle cx="155" cy="215" r="38"/><circle cx="110" cy="195" r="40"/></g>
      <g fill="#4F6F57"><circle cx="225" cy="170" r="24"/><circle cx="140" cy="195" r="20"/><circle cx="105" cy="175" r="18"/></g>
      <g fill="#D3A1AC" fill-opacity=".8"><circle cx="220" cy="158" r="5.5"/><circle cx="245" cy="195" r="5"/><circle cx="142" cy="182" r="5"/><circle cx="112" cy="160" r="4.5"/></g>
    </svg>
    <svg class="foliage" style="left:0;bottom:0;width:100%;height:12%" viewBox="0 0 1080 130" preserveAspectRatio="none">
      <path d="M0,60 C160,28 300,72 460,50 C640,26 780,70 940,48 C1010,38 1050,52 1080,44 L1080,130 L0,130 Z" fill="#5E6552" fill-opacity=".95"/>
      <path d="M0,60 C160,28 300,72 460,50 C640,26 780,70 940,48 C1010,38 1050,52 1080,44" stroke="#4F6F57" stroke-width="4" fill="none" stroke-opacity=".55"/>
      <g stroke="#4F6F57" stroke-width="4" fill="none" stroke-linecap="round" stroke-opacity=".55">
        <path d="M120,75 q6,-26 12,-10 q4,-20 10,-6"/><path d="M420,60 q6,-24 12,-9 q4,-18 10,-6"/>
        <path d="M700,68 q6,-25 12,-10 q4,-19 10,-6"/><path d="M950,55 q6,-22 12,-8 q4,-17 10,-5"/></g>
    </svg>
    <div class="petal" style="left:18%;top:-4%;width:9px;height:6px;--dx:36px;animation-duration:12s"></div>
    <div class="petal" style="left:46%;top:-6%;width:7px;height:5px;--dx:-30px;animation-duration:16s;animation-delay:3s"></div>
    <div class="petal" style="left:72%;top:-5%;width:8px;height:6px;--dx:24px;animation-duration:10s;animation-delay:6s"></div>
    <div class="petal" style="left:32%;top:-6%;width:6px;height:4px;--dx:-42px;animation-duration:14s;animation-delay:9s"></div>
    </div><div id="sprayGlow"></div>
    <canvas id="fx"></canvas>
    <div class="grain"></div>
    <div id="diag"></div>
  </div>

  <div id="speaker" title="静音开关">
    <svg viewBox="0 0 48 48" fill="none">
      <path d="M8 19v10h8l10 8V11l-10 8H8z" fill="#F4EFE6"/>
      <path class="wave" d="M32 17c3 3.8 3 10.2 0 14" stroke="#F4EFE6" stroke-width="3" stroke-linecap="round"/>
      <path class="wave" d="M38 12c5.5 6.2 5.5 17.8 0 24" stroke="#D3A1AC" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="dot"></div>
  </div>

  <div id="strip">
    <div id="listenChip" title="再听一遍">
      <div id="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="listenTxt">听句子 · 按顺序抓词</div>
    </div>
    <div id="slots"></div>
    <div id="roundBox"><div id="round">Round 1</div><div id="streak">⭐ x0 连对</div></div>
  </div>


  </div>
  <div id="coach" class="hidden">
    <div class="cnum">01</div>
    <div class="clabel">张开手掌 · 让我看见你 🖐</div>
    <div class="cbar"><div class="cfill"></div></div>
    <div class="cpct">0%</div>
  </div>
  <div id="flash"></div>
  <div id="modeTag">INIT</div>
  <div id="toast"></div>

  <div id="overlay">
    <div class="title">Listen. Catch. <b>Bloom.</b></div>
    <p>夜色森林里，喇叭念一句简单的英语<br>词会从月光里飘出来（混着干扰词）<br><b style="color:#D3A1AC">握着拳怎么动都没事；对准词后张开手掌，蓄力环填满（0.5s）就炸</b></p>
    <div class="steps">
      🎤 允许摄像头权限（画面不上传，追踪在本机完成）· 全屏就是你的魔法空间<br>
      ✊ 握拳/收拢 = 安全移动（绝不会误触）· 🖐 <b style="color:#D3A1AC">张开手掌悬停 0.5 秒</b> = 抓取 · 双手独立<br>
      🖱 没摄像头也能玩：鼠标移动 + 点击
    </div>
    <button id="startBtn">开 始</button>
  </div>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
const CFG={mouse:qs.get('mode')==='mouse',auto:qs.get('autostart')==='1',dwell:+(qs.get('dwell')||500)};
const COL={cream:'#F4EFE6',rose:'#D3A1AC',rose2:'#B4838F',bad:'#D9647A'};

const SENTENCES=[
 {t:'how are you',d:['who','or','now','u']},
 {t:'nice to meet you',d:['rice','my','see','meat']},
 {t:'what time is it',d:['when','ten','his','eat']},
 {t:'where are you from',d:['were','or','for','who']},
 {t:'i like your hat',d:['eye','look','you','cat']},
 {t:'see you later',d:['she','ate','late','u']},
 {t:'good morning class',d:['food','mood','glass','as']},
 {t:'let me see it',d:['net','tea','is','eat']}
];

let scene={w:0,h:0},cam={w:0,h:0,y0:0};
let words=[],fx=[],cursor=null;
let round=0,streak=0,okCount=0,curSent=null,expect=0,muted=false;
let handLandmarker=null,videoOK=false,lastVT=-1,modeName='INIT';
const coach={active:false,prog:0,camErr:false};
const fxc=$('#fx'),fxx=fxc.getContext('2d');
const hudc=$('#hud'),hxx=hudc.getContext('2d');
function fit(cv,c2){const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*devicePixelRatio);cv.height=Math.max(1,r.height*devicePixelRatio);
  c2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);return{w:r.width,h:r.height}}
function resize(){const prev={...scene};cam.y0=0;scene=fit(fxc,fxx);cam=fit(hudc,hxx);
  if(prev.w>0&&scene.w>0&&words.length&&(prev.w!==scene.w||prev.h!==scene.h)){
    const kx=scene.w/prev.w,ky=scene.h/prev.h;
    words.forEach(w=>{w.x*=kx;w.y*=ky})}}
addEventListener('resize',()=>setTimeout(resize,60));
resize();setTimeout(resize,300);
function setMode(n){modeName=n;$('#modeTag').textContent=n}
function coachStep(dt){
  if(!coach.active)return;
  const list=[...hands.values()];
  const good=list.some(h=>h.armed);
  if(good)coach.prog=Math.min(100,coach.prog+dt*70);
  else coach.prog=Math.max(0,coach.prog-dt*45);
  const label=coach.camErr?'需要摄像头权限 · 点击重试':
    (!list.length?'举起你的手 🖐':(good?'很好，保持…':'张开手掌 ✋'));
  const el=$('#coach');
  el.querySelector('.clabel').textContent=label;
  el.querySelector('.cfill').style.width=coach.prog+'%';
  el.querySelector('.cpct').textContent=Math.round(coach.prog)+'%';
  if(coach.prog>=100){coach.active=false;el.classList.add('hidden');startRound()}}
function coachShow(err){coach.active=true;coach.prog=0;coach.camErr=!!err;
  const el=$('#coach');el.classList.remove('hidden');el.classList.toggle('error',!!err);
  el.onclick=err?()=>initCamera():null}
function diag(){const d=$('#diag');d.textContent=`v0.8 · ${words.length} words · r${round} · ${modeName}`}

/* audio */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function blip(f,d,type='sine',g=.16){const a=ac();if(!a)return;
  const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.value=f;
  gn.gain.setValueAtTime(g,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+d)}
const sGood=()=>{blip(587,.12);setTimeout(()=>blip(880,.2),90);setTimeout(()=>blip(1174,.28),200)};
let bgmGain=null,bgmTimer=null;
function startBGM(){
  if(bgmTimer)return;
  const a=ac();if(!a)return;
  bgmGain=a.createGain();bgmGain.gain.value=.055;
  const filt=a.createBiquadFilter();filt.type='lowpass';filt.frequency.value=900;
  bgmGain.connect(filt).connect(a.destination);
  const CH=[[110,164.8,220,261.6],[87.3,130.8,174.6,220],[98,146.8,196,246.9],[82.4,123.5,164.8,196]];
  let ci=0;
  const playChord=()=>{const t=a.currentTime;
    CH[ci%CH.length].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();
      o.type=i<2?'sine':'triangle';o.frequency.value=f;o.detune.value=(i%2?4:-3);
      g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.16-Math.random()*.05,t+2.4);
      g.gain.linearRampToValueAtTime(.0001,t+8.4);
      o.connect(g).connect(bgmGain);o.start(t);o.stop(t+8.6)});
    ci++};
  playChord();bgmTimer=setInterval(playChord,8000)}
function duckBGM(on){if(!bgmGain||!ac())return;
  bgmGain.gain.setTargetAtTime(on?.018:.055,ac().currentTime,.4)}
const sBad =()=>blip(160,.28,'sawtooth',.1);
const sPop =()=>blip(520,.08,'triangle',.08);

/* speech */
let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google/i.test(v.name))
     ||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.voice=VOICE;u.lang='en-US';u.rate=.78;u.pitch=1.05;
  u.onstart=()=>{$('#strip').classList.add('speaking');duckBGM(true)};
  u.onend=()=>$('#strip').classList.remove('speaking');
  speechSynthesis.speak(u)}catch(e){}}
function speakSentence(){sPop();
  if(muted){toast(`静音模式 · 句子：${curSent.t}`,'');return}
  say(curSent.t)}

let toastT=null;
function toast(msg,cls){const t=$('#toast');t.textContent=msg;t.className='show '+cls;
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1600)}

/* words */
function sprayWord(text,isTarget,delay,cell){
  const ox=scene.w*.94,oy=scene.h*.06;
  const cols=3,rows=2;
  const cw=scene.w/cols,ch=scene.h/rows;
  const gx=cell%cols,gy=Math.floor(cell/cols);
  const tx=(gx+.5+(Math.random()-.5)*.44)*cw;
  const ty=(gy+.5+(Math.random()-.5)*.44)*ch;
  const depth=.5+Math.random()*.5;
  words.push({text,x:ox,y:oy,vx:(tx-ox)/1.1,vy:(ty-oy)/1.1,
    depth,phase:Math.random()*6.28,isTarget,state:'spray',t:0,delay,
    r:20+depth*24})}
function startRound(){
  round++;expect=0;words=[];fx=[];
  curSent=SENTENCES[(round-1)%SENTENCES.length];
  resize();
  const ws=curSent.t.split(' ');
  const ds=curSent.d.slice().sort(()=>Math.random()-.5).slice(0,2);
  const all=[...ws.map(w=>({w,target:true})),...ds.map(w=>({w,target:false}))]
    .sort(()=>Math.random()-.5);
  const cells=[...Array(6).keys()].sort(()=>Math.random()-.5);
  all.forEach((it,i)=>sprayWord(it.w,it.target,i*.16,cells[i%6]));
  $('#round').textContent='Round '+round;
  renderSlots();
  $('#sprayGlow').classList.add('on');setTimeout(()=>$('#sprayGlow').classList.remove('on'),900);
  setTimeout(speakSentence,500)}

function renderSlots(){const el=$('#slots');el.innerHTML='';
  curSent.t.split(' ').forEach((w,i)=>{const d=document.createElement('div');
    d.className='slot'+(i<expect?' filled':i===expect?' next':'');
    d.textContent=i<expect?w:'·';el.appendChild(d)})}

/* catch */
function nextWord(){return curSent.t.split(' ')[expect]||null}
function magnetWord(x,y){let best=null,bd=1e9;
  for(const w of words){if(w.state!=='fly'||w.chargingBy)continue;
    const d=Math.hypot(w.x-x,w.y-y);
    if(d<w.r+60&&d<bd){bd=d;best=w}}
  return best}
function tryCatchWord(best){
  if(!best)return;
  if(best.text===nextWord()){
    best.state='caught';if(best.locked)unlock(best);if(best.chargingBy){const hh=hands.get(best.chargingBy);if(hh){hh.dwell=null;hh.charge=0}best.chargingBy=null}    sGood();const F=$('#flash');F.classList.remove('go');void F.offsetWidth;F.classList.add('go');streak++;expect++;
    fx.push({t:'burst',x:best.x,y:best.y,a:0});
    fx.push({t:'fly',x:best.x,y:best.y,a:0});
    toast(`✓ ${best.text}${nextWord()?' · 下一个！':' ！'}`,'good');
    $('#streak').textContent=`⭐ x${streak} 连对`;renderSlots();
    if(!nextWord()){setTimeout(()=>{toast('🎉 句子完成：'+curSent.t,'good');sGood();
      setTimeout(startRound,1300)},500)}
  }else{
    const sentWords=curSent.t.split(' ');
    const done=sentWords.slice(0,expect).includes(best.text);
    const later=sentWords.slice(expect).includes(best.text);
    const why=done?`${best.text} 已抓过了`:(later?`${best.text} 顺序不对`:`${best.text} 是干扰词`);
    best.state='dead';if(best.locked)unlock(best);if(best.chargingBy){const hh=hands.get(best.chargingBy);if(hh){hh.dwell=null;hh.charge=0}best.chargingBy=null}    best.respawn=1.2;sBad();streak=0;
    $('#streak').textContent='⭐ x0 连对';
    fx.push({t:'shatter',x:best.x,y:best.y,a:0});
    toast(`✗ ${why} · 再听一遍`,'bad');
    setTimeout(speakSentence,700)}}
function tryCatch(x,y){tryCatchWord(magnetWord(x,y))}

/* separation: keep words from overlapping */
function separate(){
  for(let i=0;i<words.length;i++){const a=words[i];if(a.state!=='fly')continue;
    for(let j=i+1;j<words.length;j++){const b=words[j];if(b.state!=='fly')continue;
      let dx=b.x-a.x,dy=b.y-a.y;let d=Math.hypot(dx,dy)||.01;
      const min=a.r+b.r+90;
      if(d<min){const push=(min-d)/2;dx/=d;dy/=d;
        a.x-=dx*push;a.y-=dy*push;b.x+=dx*push;b.y+=dy*push;
        a.x=Math.max(.06*scene.w,Math.min(.94*scene.w,a.x));
        b.x=Math.max(.06*scene.w,Math.min(.94*scene.w,b.x));
        a.y=Math.max(.12*scene.h,Math.min(.85*scene.h,a.y));
        b.y=Math.max(.14*scene.h,Math.min(.7*scene.h,b.y))}}}}

/* render */
function draw(dt,now){
  fxx.clearRect(0,0,scene.w,scene.h);
  for(const w of words){
    if(w.delay>0){w.delay-=dt;continue}
    if(w.state==='dead'){w.respawn-=dt;
      if(w.respawn<=0){Object.assign(w,{x:(0.14+Math.random()*.72)*scene.w,
        y:(0.18+Math.random()*.6)*scene.h,vx:0,vy:0,state:'fly'})}else continue}
    if(w.state==='spray'){w.t+=dt;w.x+=w.vx*dt;w.y+=w.vy*dt;
      fxx.strokeStyle=`rgba(211,161,172,${Math.max(0,.35-w.t*.4)})`;fxx.lineWidth=2;
      fxx.beginPath();fxx.moveTo(w.x,w.y);fxx.lineTo(w.x-w.vx*.18,w.y-w.vy*.18);fxx.stroke();
      if(w.t>1.0){w.state='fly';w.vx=(Math.random()-.5)*.4;w.vy=(Math.random()-.5)*.2}}
    else if(w.state==='fly'){
      if(w.chargingBy){                                 // frozen while charging (pull handled in updateHand)
        fxx.strokeStyle='rgba(211,161,172,.9)';fxx.lineWidth=2.5;
        fxx.beginPath();fxx.arc(w.x,w.y,w.r+8,0,6.28);fxx.stroke()}
      else{
        let near=false;
        for(const h of hands.values()){if(Math.hypot(w.x-h.x,w.y-h.y)<w.r+90){near=true;break}}
        if(!near){w.phase+=dt*1.2;
        w.x+=(w.vx+Math.sin(w.phase)*.25)*dt*36;
        w.y+=(w.vy+Math.cos(w.phase*.8)*.12)*dt*36;
        if(w.x<.06*scene.w||w.x>.94*scene.w)w.vx*=-1;
        if(w.y<.12*scene.h||w.y>.85*scene.h)w.vy*=-1}}}
    const size=(19+w.depth*25);
    fxx.save();fxx.translate(w.x,w.y);
    fxx.font=`700 ${size}px Quicksand,Roboto,sans-serif`;
    fxx.textAlign='center';fxx.textBaseline='middle';
    const hot=w.isTarget&&w.text===nextWord();
    const alpha=w.isTarget?(.75+w.depth*.25):(.3+w.depth*.35);
    fxx.shadowColor=hot?'rgba(211,161,172,.95)':'rgba(244,239,230,.5)';
    fxx.shadowBlur=(hot?20:10)+w.depth*14;
    fxx.fillStyle=hot?COL.rose:`rgba(244,239,230,${alpha})`;
    if(w.isTarget&&!hot)fxx.fillStyle=`rgba(244,239,230,${alpha})`;
    fxx.fillText(w.text,0,0);
    fxx.restore()}
  /* fx */
  for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.a+=dt;
    if(e.t==='burst'){const p=e.a/.7;if(p>=1){fx.splice(i,1);continue}
      const R=24+p*Math.max(scene.w,scene.h)*.36;
      fxx.strokeStyle=`rgba(211,161,172,${(1-p)*.9})`;fxx.lineWidth=4-p*2.5;
      fxx.beginPath();fxx.arc(e.x,e.y,R,0,6.28);fxx.stroke();
      fxx.strokeStyle=`rgba(244,239,230,${(1-p)*.5})`;fxx.lineWidth=2;
      fxx.beginPath();fxx.arc(e.x,e.y,R*.7,0,6.28);fxx.stroke();
      for(let k=0;k<14;k++){const a=k/14*6.28+p;fxx.fillStyle=`rgba(244,239,230,${1-p})`;
        fxx.beginPath();fxx.arc(e.x+Math.cos(a)*R*.8,e.y+Math.sin(a)*R*.8,2.5*(1-p)+1,0,6.28);fxx.fill()}}
    if(e.t==='shatter'){const p=e.a/.4;if(p>=1){fx.splice(i,1);continue}
      for(let k=0;k<7;k++){const a=k/7*6.28;fxx.fillStyle=`rgba(217,100,122,${1-p})`;
        fxx.fillRect(e.x+Math.cos(a)*p*60-2,e.y+Math.sin(a)*p*60-2,4,4)}}
    if(e.t==='fly'){const p=Math.min(1,e.a/.55);const x=e.x+(scene.w*.5-e.x)*p,y=e.y+(scene.h*.04-e.y)*p;
      fxx.save();fxx.globalAlpha=1-p*.3;fxx.shadowColor='rgba(211,161,172,.9)';fxx.shadowBlur=18;
      fxx.fillStyle=COL.rose;fxx.beginPath();fxx.arc(x,y,15*(1-p*.5),0,6.28);fxx.fill();fxx.restore();
      if(p>=1)fx.splice(i,1)}}
  /* cursors: fist=safe(dashed dim) · open=armed · charging=rose progress */
  hxx.clearRect(0,0,cam.w,cam.h);
  const active=[...hands.values()];
  const mc=active;
  for(const c of active){if(c.camY>cam.y0){
    hxx.save();
    hxx.strokeStyle=c.armed?(c.dwell?COL.rose:'rgba(244,239,230,.8)'):'rgba(139,150,168,.5)';
    hxx.lineWidth=2.5;
    if(!c.armed)hxx.setLineDash([4,5]);
    hxx.beginPath();hxx.arc(c.camX,c.camY,c.armed?(c.dwell?12:16):13,0,6.28);hxx.stroke();
    hxx.restore()}}
  for(const c of mc){
    if(!c.armed){                                         // safe mode: small dashed ring
      if(c.y<=scene.h){fxx.save();
        fxx.strokeStyle='rgba(139,150,168,.55)';fxx.lineWidth=2;fxx.setLineDash([4,6]);
        fxx.beginPath();fxx.arc(c.x,c.y,12,0,6.28);fxx.stroke();
        fxx.restore()}
      continue}
    const R=c.dwell?14:19;
    if(c.dwell){
      const frac=Math.min(1,(c.charge||0)/CFG.dwell);
      fxx.save();
      fxx.strokeStyle='rgba(211,161,172,.55)';fxx.lineWidth=1.5;fxx.setLineDash([5,7]);
      fxx.beginPath();fxx.moveTo(c.x,c.y);fxx.lineTo(c.dwell.x,c.dwell.y);fxx.stroke();
      fxx.setLineDash([]);
      fxx.strokeStyle=COL.rose;fxx.lineWidth=5;fxx.lineCap='round';
      fxx.beginPath();fxx.arc(c.dwell.x,c.dwell.y,c.dwell.r+14,-Math.PI/2,-Math.PI/2+frac*6.283);fxx.stroke();
      fxx.restore();
      fxx.save();
      fxx.strokeStyle=COL.rose;fxx.lineWidth=3.5;
      fxx.beginPath();fxx.arc(c.x,c.y,R,-Math.PI/2,-Math.PI/2+frac*6.283);fxx.stroke();
      fxx.restore()}
    else if(!c.mouse){const mw=magnetWord(c.x,c.y);
      if(mw){fxx.save();
        fxx.strokeStyle='rgba(211,161,172,.35)';fxx.lineWidth=1.5;
        fxx.beginPath();fxx.arc(mw.x,mw.y,mw.r+8,0,6.28);fxx.stroke();
        fxx.restore()}}
    if(c.y<=scene.h){fxx.save();
      fxx.strokeStyle=c.dwell?COL.rose:'rgba(244,239,230,.7)';
      fxx.lineWidth=c.dwell?3.5:2.5;
      fxx.shadowColor='rgba(211,161,172,.7)';fxx.shadowBlur=10;
      if(!c.dwell){fxx.beginPath();fxx.arc(c.x,c.y,R,0,6.28);fxx.stroke()}
      fxx.restore()}}
}
/* input is hands-only now; test hook for automation */
window.__click=(x,y)=>tryCatch(x,y);
window.__bgm=()=>({timer:!!bgmTimer,gain:!!bgmGain});

/* camera + hands (palm-normalized pinch + magnet) */
async function initCamera(){
  try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false});
    const v=$('#video');v.srcObject=stream;await v.play();videoOK=true;
    toast('🎙 摄像头已就绪','')}catch(e){toast('摄像头不可用 · 鼠标模式','bad')}}
async function initHands(){
  if(CFG.mouse){setMode('MOUSE MODE');return}
  setMode('追踪加载中…');
  const bases=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
               'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
  for(const base of bases){
    try{
      const vision=await import(base+'/vision_bundle.mjs');
      const fileset=await vision.FilesetResolver.forVisionTasks(base+'/wasm');
      handLandmarker=await vision.HandLandmarker.createFromOptions(fileset,{
        baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},
        numHands:2,runningMode:'VIDEO'});
      setMode('HAND TRACKING');return
    }catch(e){console.warn('hand tracking source failed:',base,e)}}
  setMode('MOUSE MODE (追踪不可用)')}
function videoMap(nx,ny){const v=$('#video');const vw=v.videoWidth||1280,vh=v.videoHeight||720;
  const s=Math.max(cam.w/vw,cam.h/vh);const dw=vw*s,dh=vh*s;
  const ox=(cam.w-dw)/2,oy=(cam.h-dh)/2;
  let x=ox+nx*dw,y=oy+ny*dh;x=cam.w-x;
  return{x,y}}
let hands=new Map();   // key -> cursor {x,y,camX,camY,openN,pinchN,pinching,extended,locked}
function unlock(w){w.locked=null;if(w.chargingBy){const h=hands.get(w.chargingBy);if(h){h.dwell=null;h.charge=0}w.chargingBy=null}}
/* per-hand: 1:1 direct mapping + open-palm-gated dwell charge
   fist/closed = safe travel (nothing can trigger) · open palm + hover = charge -> pop */
const ARM_ON=1.1, ARM_OFF=0.85;             // openness hysteresis (fingertip spread / palm size)
function updateHand(key,lm){
  const cx0=(lm[0].x+lm[5].x+lm[9].x+lm[13].x+lm[17].x)/5;
  const cy0=(lm[0].y+lm[5].y+lm[9].y+lm[13].y+lm[17].y)/5;
  const palm=Math.hypot(lm[0].x-lm[9].x,lm[0].y-lm[9].y)||.001;
  let sp=0;for(const t of[8,12,16,20])sp+=Math.hypot(lm[t].x-cx0,lm[t].y-cy0);
  const openN=(sp/4)/palm;                                // fist ~0.5 · open ~1.5+
  const h=hands.get(key);
  const now=performance.now();
  let dt=0;
  if(h){dt=Math.min(.1,Math.max(0,(now-h.lastT)/1000))}
  const prev=h||{x:0,y:0,dwell:null,charge:0,lastT:now,armed:true};
  const p1=videoMap(cx0,cy0);                             // mirrored cam coords
  const relX=p1.x/cam.w, relY=Math.min(1,Math.max(0,p1.y/cam.h));
  const tx=relX*scene.w, ty=relY*scene.h;                 // FULL-RANGE direct map
  const a=.6;
  const x=prev.x?prev.x+(tx-prev.x)*a:tx, y=prev.y?prev.y+(ty-prev.y)*a:ty;
  let armed=prev.armed;
  if(openN>ARM_ON)armed=true;
  if(openN<ARM_OFF)armed=false;
  const hand={x,y,camX:p1.x,camY:p1.y,openN,armed,dwell:prev.dwell,charge:prev.charge,lastT:now};
  hands.set(key,hand);
  if(!armed){                                             // closed = safe: cancel anything
    if(hand.dwell){hand.dwell.chargingBy=null;hand.dwell=null}
    hand.charge=0;
    return}
  // dwell logic (open palm only)
  if(hand.dwell&&(hand.dwell.state!=='fly'||hand.dwell.chargingBy!==key)){hand.dwell=null;hand.charge=0}
  if(hand.dwell){
    const d=Math.hypot(hand.dwell.x-hand.x,hand.dwell.y-hand.y);
    if(d>hand.dwell.r+75){                                // moved away -> cancel
      hand.dwell.chargingBy=null;hand.dwell=null;hand.charge=0}
    else{
      hand.charge+=dt*1000;
      hand.dwell.x+=(hand.x-hand.dwell.x)*.12;hand.dwell.y+=(hand.y-hand.dwell.y)*.12;
      if(hand.charge>=CFG.dwell){
        const w=hand.dwell;hand.dwell=null;hand.charge=0;tryCatchWord(w)}}}
  else{
    let best=null,bd=1e9;
    for(const w of words){if(w.state!=='fly'||w.chargingBy)continue;
      const d=Math.hypot(w.x-hand.x,w.y-hand.y);
      if(d<w.r+45&&d<bd){bd=d;best=w}}
    if(best){best.chargingBy=key;hand.dwell=best;hand.charge=0}}}
function dropHand(key){const h=hands.get(key);
  if(h&&h.dwell){h.dwell.chargingBy=null}
  if(h&&h.locked)unlock(h.locked);
  hands.delete(key)}
function detectHands(){
  if(!handLandmarker||!videoOK)return;
  const v=$('#video');if(v.readyState<2)return;
  if(v.currentTime===lastVT)return;lastVT=v.currentTime;
  let res;try{res=handLandmarker.detectForVideo(v,performance.now())}catch(e){return}
  const seen=new Set();
  (res.landmarks||[]).forEach((lm,i)=>{
    const key=res.handedness?.[i]?.[0]?.categoryName||('h'+i);seen.add(key);
    updateHand(key,lm)});
  for(const k of [...hands.keys()])if(!seen.has(k))dropHand(k)}
/* mouse fallback acts as an extra cursor when no hands */
window.__simHand=(key,mode,cx=.5,cy=.5)=>{const lm=[];const mk=(x,y)=>({x,y});
  lm[0]=mk(cx,cy+.09);lm[9]=mk(cx,cy-.02);lm[5]=mk(cx-.05,cy);lm[13]=mk(cx+.05,cy);lm[17]=mk(cx+.08,cy+.05);
  const open=mode!=='fist';
  const ex=open?.16:.045;
  lm[4]=mk(cx-(open?.12:.03),cy+(open?.05:.02));
  lm[8]=mk(cx-(open?.08:.03),cy-(open?.12:.01));
  lm[12]=mk(cx+ex*.8,cy-ex*.5);lm[16]=mk(cx-ex*.2,cy-ex);lm[20]=mk(cx-ex,cy-ex*.3);
  lm[1]=mk(cx-.04,cy+.03);lm[2]=mk(cx-.04,cy);lm[3]=mk(cx-.04,cy-.02);
  lm[6]=mk(cx-.05,cy-.03);lm[7]=mk(cx-.05,cy-.09);
  lm[10]=mk(cx+.01,cy-.06);lm[11]=mk(cx+.01,cy-.12);
  lm[14]=mk(cx+.06,cy-.05);lm[15]=mk(cx+.06,cy-.11);
  lm[18]=mk(cx+.1,cy-.02);lm[19]=mk(cx+.11,cy-.08);
  updateHand(key,lm);
  const h=hands.get(key);
  return {key,armed:h.armed,openN:+h.openN.toFixed(2),dwell:h.dwell?h.dwell.text:null,
    charge:Math.round(h.charge),x:Math.round(h.x),y:Math.round(h.y)}};
window.__state=()=>({hands:[...hands.entries()].map(([k,h])=>({k,x:Math.round(h.x),y:Math.round(h.y),
    armed:h.armed,openN:+(h.openN||0).toFixed(2),dwell:h.dwell?h.dwell.text:null,charge:Math.round(h.charge)})),
  scene:[Math.round(scene.w),Math.round(scene.h)],expect,cur:curSent&&curSent.t,streak,round,
  fly:words.filter(w=>w.state==='fly').map(w=>w.text+(w.locked?'🔒':''))});
window.__popTest=()=>window.__simHand('sim','pinch');
window.__aim=(fx,fy)=>{const v=$('#video');const vw=v.videoWidth||1280,vh=v.videoHeight||720;
  const s=Math.max(cam.w/vw,cam.h/vh);const dw=vw*s,dh=vh*s;
  const ox=(cam.w-dw)/2,oy=(cam.h-dh)/2;
  let vx=((1-fx)*cam.w-ox)/dw, vy=(fy*cam.h-oy)/dh;
  return {vx:Math.min(1,Math.max(0,vx)),vy:Math.min(1,Math.max(0,vy))}};
window.__gap=()=>{const fly=words.filter(w=>w.state==='fly');let min=1e9;
  for(let i=0;i<fly.length;i++)for(let j=i+1;j<fly.length;j++)
    min=Math.min(min,Math.hypot(fly[i].x-fly[j].x,fly[i].y-fly[j].y)-(fly[i].r+fly[j].r));
  return Math.round(min)};
window.__sectors=()=>{const fly=words.filter(w=>w.state==='fly');
  return {cols:[...new Set(fly.map(w=>Math.floor(w.x/(scene.w/3))))].sort(),
          rows:[...new Set(fly.map(w=>Math.floor(w.y/(scene.h/2))))].sort(),n:fly.length}};
window.__place=(text,fx,fy)=>{const w=words.find(w=>w.state==='fly'&&w.text===text);
  if(w){w.x=scene.w*fx;w.y=scene.h*fy}return !!w};

/* UI */
$('#speaker').addEventListener('click',()=>{muted=!muted;
  $('#speaker').classList.toggle('muted',muted);
  if(muted&&'speechSynthesis' in window)speechSynthesis.cancel();
  if(muted)toast(`🔇 已静音 · 句子：${curSent?curSent.t:''}`,'');
  else speakSentence()});
$('#listenChip').addEventListener('click',()=>speakSentence());
$('#startBtn').addEventListener('click',()=>{
  ac();$('#overlay').classList.add('hidden');
  startBGM();
  coachShow();
  initCamera().then(()=>{if(!videoOK)coachShow(true)}).then(initHands).catch(()=>{coachShow(true);initHands()});});

/* debug hooks */
window.__word=t=>{const w=words.find(w=>w.state==='fly'&&w.text===t);return w?{x:w.x,y:w.y}:null};
window.__wrongWord=()=>{const list=curSent?curSent.t.split(' '):[];const w=words.find(w=>w.state==='fly'&&!list.includes(w.text));return w?{x:w.x,y:w.y,t:w.text}:null};
window.__dbg=()=>({words:words.length,scene:scene.w+'x'+scene.h,cam:cam.w+'x'+cam.h,
  s0:words[0]?{st:words[0].state,x:Math.round(words[0].x),y:Math.round(words[0].y),d:+words[0].delay.toFixed(2),t:words[0].text}:null,
  mode:modeName,round,cur:curSent&&curSent.t,canvas:[fxc.width,fxc.height]});
window.__sep=()=>{const fly=words.filter(w=>w.state==='fly');let min=1e9;
  for(let i=0;i<fly.length;i++)for(let j=i+1;j<fly.length;j++){
    min=Math.min(min,Math.hypot(fly[i].x-fly[j].x,fly[i].y-fly[j].y)-(fly[i].r+fly[j].r))}
  return Math.round(min)};

/* loop */
let last=performance.now(),diagT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(scene.w<10)resize();
  detectHands();
  coachStep(dt);
  separate();
  draw(dt,now/1000);
  diagT+=dt;if(diagT>.5){diagT=0;diag()}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(CFG.auto){$('#overlay').classList.add('hidden');try{startBGM()}catch(e){};coachShow()}
</script>
