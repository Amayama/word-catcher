<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Word Catcher · 听句抓词 v0.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#000;overflow:hidden;
  font-family:'PingFang SC','WenQuanYi Zen Hei','Microsoft YaHei',sans-serif;color:#fff}
body{display:flex;justify-content:center;align-items:center}
#app{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));
  background:#0b0618;overflow:hidden}

#scene{position:absolute;left:0;top:0;width:100%;height:56%;overflow:hidden;
  background:
   radial-gradient(110% 70% at 50% -8%, #432075 0%, rgba(67,32,117,0) 60%),
   radial-gradient(70% 50% at 18% 34%, rgba(147,51,234,.42), rgba(147,51,234,0) 70%),
   radial-gradient(60% 46% at 82% 60%, rgba(217,70,239,.25), rgba(217,70,239,0) 72%),
   linear-gradient(180deg,#150a2f 0%,#1c0e40 42%,#29134f 100%)}
.cloud{position:absolute;border-radius:50%;filter:blur(46px);mix-blend-mode:screen;pointer-events:none}
.c1{left:-14%;top:8%;width:52%;height:38%;background:radial-gradient(closest-side,rgba(124,58,237,.5),rgba(124,58,237,0))}
.c2{right:-11%;top:28%;width:48%;height:36%;background:radial-gradient(closest-side,rgba(192,38,211,.32),rgba(192,38,211,0))}
.c3{left:20%;top:55%;width:60%;height:34%;background:radial-gradient(closest-side,rgba(147,51,234,.28),rgba(147,51,234,0))}
.beam{position:absolute;left:31%;top:-5%;width:38%;height:80%;
  background:linear-gradient(180deg,rgba(216,180,254,.20),rgba(216,180,254,0) 70%);
  filter:blur(30px);transform:rotate(8deg)}
#stars{position:absolute;inset:0;background-image:
  radial-gradient(2px 2px at 40px 60px,rgba(255,255,255,.85) 45%,transparent 50%),
  radial-gradient(1.6px 1.6px at 150px 210px,rgba(233,213,255,.8) 45%,transparent 50%),
  radial-gradient(2.2px 2.2px at 260px 90px,rgba(255,255,255,.7) 45%,transparent 50%),
  radial-gradient(1.4px 1.4px at 90px 330px,rgba(216,180,254,.75) 45%,transparent 50%),
  radial-gradient(1.8px 1.8px at 320px 280px,rgba(255,255,255,.6) 45%,transparent 50%);
  background-size:33% 36%;background-repeat:repeat}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3}
#diag{position:absolute;right:2.5%;bottom:3%;z-index:4;font-size:10px;letter-spacing:1px;
  color:#9d7ac9;opacity:.55}

#speaker{position:absolute;right:2.5%;top:3%;width:52px;height:52px;border-radius:15px;
  background:rgba(30,16,60,.55);border:1px solid rgba(216,180,254,.35);
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:8;
  box-shadow:0 0 18px rgba(147,51,234,.35);transition:transform .15s}
#speaker:active{transform:scale(.92)}
#speaker svg{width:28px;height:28px}
#speaker .dot{position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:#a3e635;box-shadow:0 0 8px #a3e635}
#speaker.muted .dot{background:#71717a;box-shadow:none}
#speaker.muted .wave{opacity:.15}
#sprayGlow{position:absolute;right:2%;top:2%;width:90px;height:90px;border-radius:50%;z-index:2;
  background:radial-gradient(closest-side,rgba(240,171,252,.55),rgba(240,171,252,0) 70%);
  filter:blur(6px);opacity:0;transition:opacity .25s;pointer-events:none}
#sprayGlow.on{opacity:1}

#strip{position:absolute;left:0;top:56%;width:100%;height:7%;z-index:6;
  background:linear-gradient(180deg,rgba(24,12,48,.94),rgba(16,8,34,.97));
  border-top:1px solid rgba(196,141,255,.25);border-bottom:1px solid rgba(196,141,255,.15);
  display:flex;align-items:center;gap:10px;padding:0 3.5%}
#listenChip{display:flex;align-items:center;gap:8px;background:rgba(124,58,237,.22);
  border:1px solid rgba(196,141,255,.45);border-radius:40px;padding:5px 12px;cursor:pointer;flex:none}
#wave{display:flex;align-items:center;gap:4px;height:24px}
#wave i{display:block;width:4px;border-radius:2px;background:linear-gradient(180deg,#e879f9,#7c3aed);height:8px}
#strip.speaking #wave i{animation:wv .5s ease-in-out infinite alternate}
#wave i:nth-child(2){animation-delay:.1s}#wave i:nth-child(3){animation-delay:.2s}
#wave i:nth-child(4){animation-delay:.3s}#wave i:nth-child(5){animation-delay:.15s}
@keyframes wv{from{height:6px}to{height:22px}}
#listenTxt{font-size:13px;letter-spacing:1px;opacity:.9;white-space:nowrap}
#slots{display:flex;gap:6px;margin:0 auto;flex:none}
.slot{min-width:46px;height:27px;border-radius:8px;border:1.5px dashed rgba(196,141,255,.4);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:rgba(196,141,255,.4);
  padding:0 6px;font-family:Georgia,'Times New Roman',serif;font-style:italic}
.slot.next{border-color:rgba(240,171,252,.95);box-shadow:0 0 12px rgba(232,121,249,.35)}
.slot.filled{border:1.5px solid rgba(240,171,252,.9);color:#fff;
  background:linear-gradient(180deg,rgba(147,51,234,.5),rgba(124,58,237,.35));font-weight:700;
  box-shadow:0 0 16px rgba(232,121,249,.55)}
#roundBox{margin-left:auto;text-align:right;flex:none}
#round{font-size:14px;color:#f0abfc;font-weight:700;white-space:nowrap}
#streak{font-size:11px;color:#c4b5fd;opacity:.85;margin-top:2px;white-space:nowrap}

#cam{position:absolute;left:0;top:63%;width:100%;height:37%;overflow:hidden;background:#0a0516}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
  filter:brightness(.85) saturate(.9)}
#camShade{position:absolute;inset:0;background:
  radial-gradient(70% 55% at 50% 0%,rgba(147,51,234,.20),transparent 70%),
  linear-gradient(180deg,rgba(10,5,22,.25),rgba(6,3,14,.55));pointer-events:none}
#scan{position:absolute;inset:0;opacity:.4;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px)}
#camLabel{position:absolute;left:3%;bottom:5%;font-size:11px;letter-spacing:3px;color:#c4b5fd;opacity:.55;z-index:5}
#camLive{position:absolute;left:3%;top:6%;font-size:11px;letter-spacing:2px;color:#f0abfc;opacity:.8;z-index:5;
  display:flex;align-items:center;gap:7px}
#camLive i{width:8px;height:8px;border-radius:50%;background:#f43f5e;box-shadow:0 0 8px #f43f5e;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#hud{position:absolute;inset:0;width:100%;height:100%;z-index:4}

#overlay{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;text-align:center;
  background:rgba(8,4,18,.82);backdrop-filter:blur(6px);padding:0 12%}
#overlay h1{font-size:24px;letter-spacing:2px;font-weight:700}
#overlay h1 b{color:#f0abfc;font-family:Georgia,serif;font-style:italic}
#overlay p{font-size:14px;color:#c4b5fd;line-height:1.8}
#overlay .steps{font-size:13px;color:#9d7ac9;line-height:2}
#startBtn{margin-top:6px;padding:14px 52px;border-radius:44px;border:none;cursor:pointer;
  font-size:18px;font-weight:700;color:#fff;letter-spacing:2px;
  background:linear-gradient(90deg,#7c3aed,#e879f9);box-shadow:0 0 30px rgba(232,121,249,.5)}
#startBtn:active{transform:scale(.96)}
#overlay.hidden{display:none}
#toast{position:absolute;left:50%;top:60%;transform:translateX(-50%);z-index:15;
  padding:10px 26px;border-radius:30px;font-size:14px;letter-spacing:1px;
  background:rgba(20,10,40,.9);border:1px solid rgba(196,141,255,.4);
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#toast.good{color:#d8ffcf;border-color:rgba(163,230,53,.5)}
#toast.bad{color:#ffd2d2;border-color:rgba(244,63,94,.5)}
#modeTag{position:absolute;right:3%;top:64.5%;z-index:9;font-size:10px;letter-spacing:2px;
  color:#c4b5fd;opacity:.6}
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div class="beam"></div><div id="stars"></div>
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
    <div id="sprayGlow"></div>
    <canvas id="fx"></canvas>
    <div id="diag"></div>
  </div>

  <div id="speaker" title="静音开关">
    <svg viewBox="0 0 48 48" fill="none">
      <path d="M8 19v10h8l10 8V11l-10 8H8z" fill="#e9d5ff"/>
      <path class="wave" d="M32 17c3 3.8 3 10.2 0 14" stroke="#e9d5ff" stroke-width="3" stroke-linecap="round"/>
      <path class="wave" d="M38 12c5.5 6.2 5.5 17.8 0 24" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="dot"></div>
  </div>

  <div id="strip">
    <div id="listenChip" title="再听一遍">
      <div id="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <div id="listenTxt">听句子 · 按顺序抓词</div>
    </div>
    <div id="slots"></div>
    <div id="roundBox"><div id="round">Round 1</div><div id="streak">⭐ x0 连对</div></div>
  </div>

  <div id="cam">
    <video id="video" playsinline muted autoplay></video>
    <div id="camShade"></div><div id="scan"></div>
    <canvas id="hud"></canvas>
    <div id="camLive"><i></i>LIVE · 手部追踪中</div>
    <div id="camLabel">镜头 · 对准你</div>
  </div>
  <div id="modeTag">INIT</div>
  <div id="toast"></div>

  <div id="overlay">
    <h1>听句抓词 · <b>Sentence Catcher</b></h1>
    <p>喇叭念一句简单的英语<br>上半屏会从喇叭喷出这句话的词 + 干扰词<br><b style="color:#f0abfc">按听到的顺序，张手→合拢捏住它们</b></p>
    <div class="steps">
      🎤 允许摄像头权限（手部追踪在本机完成，不上传）<br>
      🖐 举手让镜头看到 · 🤏 拇指食指张合 = 抓取<br>
      🖱 没摄像头也能玩：鼠标移动 + 点击
    </div>
    <button id="startBtn">开 始</button>
  </div>
</div>

<script type="module">
const $=s=>document.querySelector(s);
const qs=new URLSearchParams(location.search);
const CFG={mouse:qs.get('mode')==='mouse',auto:qs.get('autostart')==='1'};

/* ---------- sentences + distractors ---------- */
const SENTENCES=[
 {t:'how are you',d:['who','or','now','u']},
 {t:'nice to meet you',d:['rice','my','see','meat']},
 {t:'what time is it',d:['when','ten','his','eat']},
 {t:'where are you from',d:['were','or','for','who']},
 {t:'i like your hat',d:['eye','look','you','cat']},
 {t:'see you later',d:['she','ate','late','u']},
 {t:'good morning class',d:['food','mood','glass','as']},
 {t:'let me see it',d:['net','tea','is','eat']}
];

/* ---------- state ---------- */
let scene={w:0,h:0},cam={w:0,h:0,y0:0};
let words=[],fx=[],cursor=null;
let round=0,streak=0,okCount=0,curSent=null,expect=0,muted=false;
let handLandmarker=null,videoOK=false,lastVT=-1,modeName='INIT';
const fxc=$('#fx'),fxx=fxc.getContext('2d');
const hudc=$('#hud'),hxx=hudc.getContext('2d');
function fit(cv,c2){const r=cv.getBoundingClientRect();
  cv.width=Math.max(1,r.width*devicePixelRatio);cv.height=Math.max(1,r.height*devicePixelRatio);
  c2.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);return{w:r.width,h:r.height}}
function resize(){const prev={...scene};scene=fit(fxc,fxx);cam=fit(hudc,hxx);
  if(prev.w>0&&scene.w>0&&words.length&&(prev.w!==scene.w||prev.h!==scene.h)){
    const kx=scene.w/prev.w,ky=scene.h/prev.h;
    words.forEach(w=>{w.x*=kx;w.y*=ky})}}
addEventListener('resize',()=>setTimeout(resize,60));
resize();setTimeout(resize,300);

function setMode(n){modeName=n;$('#modeTag').textContent=n}
window.__word=t=>{const w=words.find(w=>w.state==='fly'&&w.text===t);return w?{x:w.x,y:w.y}:null};
window.__wrongWord=()=>{const list=curSent?curSent.t.split(' '):[];const w=words.find(w=>w.state==='fly'&&!list.includes(w.text));return w?{x:w.x,y:w.y,t:w.text}:null};
window.__dbg=()=>({words:words.length,scene:scene.w+'x'+scene.h,cam:cam.w+'x'+cam.h,
  s0:words[0]?{st:words[0].state,x:Math.round(words[0].x),y:Math.round(words[0].y),d:+words[0].delay.toFixed(2),t:words[0].text}:null,
  mode:modeName,round,cur:curSent&&curSent.t,canvas:[fxc.width,fxc.height]});
function diag(){const d=$('#diag');
  d.textContent=`${words.length} words · r${round} · ${modeName}`}

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function blip(f,d,type='sine',g=.18){const a=ac();if(!a)return;
  const o=a.createOscillator(),gn=a.createGain();o.type=type;o.frequency.value=f;
  gn.gain.setValueAtTime(g,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);
  o.connect(gn).connect(a.destination);o.start();o.stop(a.currentTime+d)}
const sGood=()=>{blip(660,.12);setTimeout(()=>blip(990,.18),90)};
const sBad =()=>blip(140,.25,'sawtooth',.12);
const sPop =()=>blip(520,.08,'triangle',.1);

/* ---------- speech ---------- */
let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>/en[-_]US/i.test(v.lang)&&/google/i.test(v.name))
     ||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text,onend){if(!('speechSynthesis' in window)){onend&&onend();return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.voice=VOICE;u.lang='en-US';u.rate=.78;u.pitch=1.05;
  u.onstart=()=>$('#strip').classList.add('speaking');
  u.onend=()=>{$('#strip').classList.remove('speaking');onend&&onend()};
  speechSynthesis.speak(u)}catch(e){onend&&onend()}}
function speakSentence(){sPop();
  if(muted){toast(`静音模式 · 句子：${curSent.t}`,'');return}
  say(curSent.t)}

/* ---------- toast ---------- */
let toastT=null;
function toast(msg,cls){const t=$('#toast');t.textContent=msg;t.className='show '+cls;
  clearTimeout(toastT);toastT=setTimeout(()=>t.className='',1600)}

/* ---------- words & spray ---------- */
function sprayWord(text,isTarget,delay){
  const ox=scene.w*.92,oy=scene.h*.08;               // speaker origin
  const tx=(0.1+Math.random()*.78)*scene.w;          // drift target
  const ty=(0.22+Math.random()*.44)*scene.h;
  const depth=.45+Math.random()*.55;
  words.push({text,x:ox,y:oy,vx:(tx-ox)/1.1,vy:(ty-oy)/1.1,
    depth,phase:Math.random()*6.28,isTarget,state:'spray',t:0,delay,
    r:20+depth*26})}
function startRound(){
  round++;expect=0;words=[];fx=[];
  curSent=SENTENCES[(round-1)%SENTENCES.length];
  resize();
  const ws=curSent.t.split(' ');
  const ds=curSent.d.slice().sort(()=>Math.random()-.5).slice(0,2+((ws.length<4)?1:0));
  const all=[...ws.map((w,i)=>({w,order:i,target:true})),
             ...ds.map(w=>({w,order:-1,target:false}))]
    .sort(()=>Math.random()-.5);
  all.forEach((it,i)=>sprayWord(it.w,it.target,i*.16));
  $('#round').textContent='Round '+round;
  renderSlots();
  $('#sprayGlow').classList.add('on');setTimeout(()=>$('#sprayGlow').classList.remove('on'),900);
  setTimeout(speakSentence,500)}

/* ---------- slots ---------- */
function renderSlots(){const el=$('#slots');el.innerHTML='';
  curSent.t.split(' ').forEach((w,i)=>{const d=document.createElement('div');
    d.className='slot'+(i<expect?' filled':i===expect?' next':'');
    d.textContent=i<expect?w:'·';el.appendChild(d)})}

/* ---------- catch ---------- */
function nextWord(){return curSent.t.split(' ')[expect]||null}
function tryCatch(x,y){let best=null,bd=1e9;
  for(const w of words){if(w.state!=='fly')continue;
    const d=Math.hypot(w.x-x,w.y-y);if(d<w.r+40&&d<bd){bd=d;best=w}}
  if(!best)return;
  if(best.text===nextWord()){
    best.state='caught';sGood();streak++;expect++;
    fx.push({t:'burst',x:best.x,y:best.y,a:0});
    fx.push({t:'fly',x:best.x,y:best.y,a:0});
    toast(`✓ ${best.text}${expect<curSent.t.split(' ').length?' · 下一个！':' ！'}`,'good');
    $('#streak').textContent=`⭐ x${streak} 连对`;renderSlots();
    if(!nextWord()){setTimeout(()=>{toast('🎉 句子完成：'+curSent.t,'good');sGood();
      setTimeout(startRound,1300)},500)}
  }else{
    const sentWords=curSent.t.split(' ');
    const done=sentWords.slice(0,expect).includes(best.text);
    const later=sentWords.slice(expect).includes(best.text);
    const why=done?`${best.text} 已抓过了`:(later?`${best.text} 顺序不对`:`${best.text} 是干扰词`);
    best.state='dead';best.respawn=1.2;sBad();streak=0;
    $('#streak').textContent='⭐ x0 连对';
    fx.push({t:'shatter',x:best.x,y:best.y,a:0});
    toast(`✗ ${why} · 再听一遍`,'bad');
    setTimeout(speakSentence,700)}}

/* ---------- rendering ---------- */
function draw(dt,now){
  fxx.clearRect(0,0,scene.w,scene.h);
  for(const w of words){
    if(w.delay>0){w.delay-=dt;continue}
    if(w.state==='dead'){w.respawn-=dt;
      if(w.respawn<=0){const tx=(0.12+Math.random()*.76)*scene.w,ty=(0.24+Math.random()*.42)*scene.h;
        Object.assign(w,{x:tx,y:ty,vx:0,vy:0,state:'fly'})}else continue}
    if(w.state==='spray'){w.t+=dt;w.x+=w.vx*dt;w.y+=w.vy*dt;
      // trail while spraying
      fxx.strokeStyle=`rgba(240,171,252,${Math.max(0,.35-w.t*.4)})`;fxx.lineWidth=2;
      fxx.beginPath();fxx.moveTo(w.x,w.y);fxx.lineTo(w.x-w.vx*.18,w.y-w.vy*.18);fxx.stroke();
      if(w.t>1.0){w.state='fly';w.vx=(Math.random()-.5)*.4;w.vy=(Math.random()-.5)*.2}}
    else if(w.state==='fly'){w.phase+=dt*1.2;
      w.x+=(w.vx+Math.sin(w.phase)*.25)*dt*36;
      w.y+=(w.vy+Math.cos(w.phase*.8)*.12)*dt*36;
      if(w.x<.07*scene.w||w.x>.93*scene.w)w.vx*=-1;
      if(w.y<.18*scene.h||w.y>.72*scene.h)w.vy*=-1}
    const size=(20+w.depth*26);
    fxx.save();fxx.translate(w.x,w.y);
    fxx.font=`italic 700 ${size}px Georgia,'Times New Roman',serif`;
    fxx.textAlign='center';fxx.textBaseline='middle';
    const alpha=0.4+w.depth*.6;
    const hot=w.isTarget&&w.text===nextWord();
    fxx.shadowColor=hot?'rgba(232,121,249,1)':'rgba(147,51,234,.7)';
    fxx.shadowBlur=(hot?22:12)+w.depth*18;
    fxx.fillStyle=hot?`rgba(255,255,255,${alpha})`:`rgba(216,180,254,${alpha*.9})`;
    fxx.fillText(w.text,0,0);
    fxx.restore()}
  for(let i=fx.length-1;i>=0;i--){const e=fx[i];e.a+=dt;
    if(e.t==='burst'){const p=e.a/.5;if(p>=1){fx.splice(i,1);continue}
      fxx.strokeStyle=`rgba(240,171,252,${1-p})`;fxx.lineWidth=3;
      fxx.beginPath();fxx.arc(e.x,e.y,18+p*90,0,6.28);fxx.stroke()}
    if(e.t==='shatter'){const p=e.a/.4;if(p>=1){fx.splice(i,1);continue}
      for(let k=0;k<7;k++){const a=k/7*6.28;fxx.fillStyle=`rgba(244,63,94,${1-p})`;
        fxx.fillRect(e.x+Math.cos(a)*p*60-2,e.y+Math.sin(a)*p*60-2,4,4)}}
    if(e.t==='fly'){const p=Math.min(1,e.a/.55);const x=e.x+(scene.w*.5-e.x)*p,y=e.y+(scene.h*.04-e.y)*p;
      fxx.save();fxx.globalAlpha=1-p*.3;fxx.shadowColor='rgba(232,121,249,.9)';fxx.shadowBlur=20;
      fxx.fillStyle='#f0abfc';fxx.beginPath();fxx.arc(x,y,15*(1-p*.5),0,6.28);fxx.fill();fxx.restore();
      if(p>=1)fx.splice(i,1)}}
  hxx.clearRect(0,0,cam.w,cam.h);
  if(cursor){const{x,y,pinch}=cursor;
    if(y<=scene.h){fxx.save();
      fxx.strokeStyle=pinch?'rgba(240,171,252,.95)':'rgba(196,141,255,.65)';
      fxx.lineWidth=pinch?3:2;fxx.shadowColor='rgba(196,141,255,.8)';fxx.shadowBlur=12;
      fxx.beginPath();fxx.arc(x,y,pinch?14:22,0,6.28);fxx.stroke();
      fxx.fillStyle='rgba(240,171,252,.9)';
      fxx.beginPath();fxx.arc(x,y,pinch?6:4,0,6.28);fxx.fill();fxx.restore()}
    if(y>cam.y0){hxx.save();hxx.strokeStyle='rgba(240,171,252,.8)';hxx.lineWidth=2;
      hxx.beginPath();hxx.arc(x,y-cam.y0,pinch?12:20,0,6.28);hxx.stroke();hxx.restore()}}}

/* ---------- mouse / touch (always active as fallback) ---------- */
addEventListener('mousemove',e=>{const r=$('#app').getBoundingClientRect();
  cursor={x:e.clientX-r.left,y:e.clientY-r.top,pinch:cursor?.pinch||false,mouse:true}});
addEventListener('mousedown',()=>{if(cursor&&(!handLandmarker||!videoOK||cursor.mouse))tryCatch(cursor.x,cursor.y)});
addEventListener('touchstart',e=>{const r=$('#app').getBoundingClientRect();const t=e.touches[0];
  cursor={x:t.clientX-r.left,y:t.clientY-r.top,pinch:true};tryCatch(cursor.x,cursor.y)},{passive:true});

/* ---------- camera + hands ---------- */
async function initCamera(){
  try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false});
    const v=$('#video');v.srcObject=stream;await v.play();videoOK=true;
    toast('🎙 摄像头已就绪','')}catch(e){toast('摄像头不可用 · 鼠标模式','bad')}}
async function initHands(){
  if(CFG.mouse){setMode('MOUSE MODE');return}
  setMode('追踪加载中…');
  const bases=['https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
               'https://unpkg.com/@mediapipe/tasks-vision@0.10.14'];
  for(const base of bases){
    try{
      const vision=await import(base+'/vision_bundle.mjs');
      const fileset=await vision.FilesetResolver.forVisionTasks(base+'/wasm');
      handLandmarker=await vision.HandLandmarker.createFromOptions(fileset,{
        baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},
        numHands:2,runningMode:'VIDEO'});
      setMode('HAND TRACKING');return
    }catch(e){console.warn('hand tracking source failed:',base,e)}}
  setMode('MOUSE MODE (追踪不可用)')}
function videoMap(nx,ny){const v=$('#video');const vw=v.videoWidth||1280,vh=v.videoHeight||720;
  const s=Math.max(cam.w/vw,cam.h/vh);const dw=vw*s,dh=vh*s;
  const ox=(cam.w-dw)/2,oy=(cam.h-dh)/2;
  let x=ox+nx*dw,y=oy+ny*dh;x=cam.w-x;
  return{x,y:cam.y0+y}}
let hands=new Map();
function detectHands(){
  if(!handLandmarker||!videoOK)return;
  const v=$('#video');if(v.readyState<2)return;
  if(v.currentTime===lastVT)return;lastVT=v.currentTime;
  let res;try{res=handLandmarker.detectForVideo(v,performance.now())}catch(e){return}
  const seen=new Set();
  (res.landmarks||[]).forEach((lm,i)=>{
    const key=res.handedness?.[i]?.[0]?.categoryName||('h'+i);seen.add(key);
    const thumb=lm[4],idx=lm[8];
    const pinch=Math.hypot(thumb.x-idx.x,thumb.y-idx.y)<0.055;
    const p1=videoMap((thumb.x+idx.x)/2,(thumb.y+idx.y)/2);
    const hn=Math.min(1,Math.max(0,(p1.y-cam.y0)/cam.h));
    const h=hands.get(key)||{};
    const cx=p1.x,cy=scene.h*(0.10+0.70*hn);
    if(pinch&&!h.pinch)tryCatch(cx,cy);
    hands.set(key,{pinch,cx,cy})});
  for(const k of [...hands.keys()])if(!seen.has(k))hands.delete(k);
  const arr=[...hands.values()];
  if(arr.length)cursor={x:arr[0].cx,y:arr[0].cy,pinch:arr[0].pinch,mouse:false}}

/* ---------- UI ---------- */
$('#speaker').addEventListener('click',()=>{muted=!muted;
  $('#speaker').classList.toggle('muted',muted);
  if(muted&&'speechSynthesis' in window)speechSynthesis.cancel();
  if(muted)toast(`🔇 已静音 · 句子：${curSent?curSent.t:''}`,'');
  else{speakSentence()}});
$('#listenChip').addEventListener('click',()=>speakSentence());
$('#startBtn').addEventListener('click',()=>{
  ac();$('#overlay').classList.add('hidden');
  startRound();                    // game starts immediately
  initCamera().then(initHands).catch(()=>initHands()); // never blocks play
});

/* ---------- main loop ---------- */
let last=performance.now(),diagT=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const appR=$('#app').getBoundingClientRect();cam.y0=appR.height*.63;
  if(scene.w<10)resize();
  detectHands();
  draw(dt,now/1000);
  diagT+=dt;if(diagT>.5){diagT=0;diag()}
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(CFG.auto){$('#overlay').classList.add('hidden');startRound()}
</script>
